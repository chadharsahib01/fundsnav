services:
  fn-frontend:
    build:
      context: ./frontend/
      dockerfile: Dockerfile.prod
    container_name: fn-frontend
    entrypoint: /frontend/entrypoint.prod.sh
    volumes:
      - ./frontend:/frontend
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "3000:3000"
    networks:
      - staging
    depends_on:
      - fn-backend
  fn-backend:
    build:
      context: ./backend/
      dockerfile: Dockerfile.prod
    container_name: fn-backend
    entrypoint: /backend/entrypoint.prod.sh
    volumes:
      - ./backend:/backend
      - static:/backend/static
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.prod
    networks:
      - staging
    depends_on:
      - fn-redis
  fn-redis:
    image: redis:latest
    container_name: fn-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - staging

volumes:
  static:
  redis-data:


networks:
  staging:
    driver: bridge
    ipam:
      config:
        - subnet: 14.28.0.0/16
          gateway: 14.28.0.1
